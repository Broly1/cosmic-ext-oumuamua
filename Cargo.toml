[package]
name = "cosmic-ext-oumuamua"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A frosted-glass application grid launcher for the COSMIC™ desktop"
repository = "https://github.com/Broly1/cosmic-ext-oumuamua"
rust-version = "1.90"

[lib]
name = "oumuamua"
path = "src/lib.rs"

[[bin]]
name = "cosmic-ext-oumuamua"
path = "src/main.rs"

[[bin]]
name = "cosmic-ext-oumuamua-applet"
path = "src/bin/applet.rs"

[build-dependencies]
xdgen = "0.1"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "7"
env_logger = "0.11"
i18n-embed-fl = "0.10"
log = "0.4"
mime_guess = "2"
percent-encoding = "2"
rust-embed = "8.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "process", "time"] }
walkdir = "2"
# clipboard that outlives the launcher surface (ext-data-control-v1)
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

# libcosmic is pinned to the revision this was developed and tested against.
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for features.
[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "009fb9d4138f25615122c4ccc42d025472da9cdd"
default-features = false
features = [
    # Applet support, and activation tokens so launched apps get focus
    "applet",
    "applet-token",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Desktop entry loading
    "desktop",
    # Support creating additional surfaces
    "multi-window",
    # Toggle the running launcher instead of starting a second one
    "single-instance",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Add Wayland support to winit
    "wayland",
    "wgpu",
    "winit",
]

[dependencies.cosmic-launch]
git = "https://github.com/pop-os/libcosmic"
rev = "009fb9d4138f25615122c4ccc42d025472da9cdd"
default-features = false
features = ["tokio"]

[profile.release]
lto = "thin"

