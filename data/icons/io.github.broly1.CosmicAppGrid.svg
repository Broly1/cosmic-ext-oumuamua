<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- COSMIC App Grid icon: a porthole into space with a planet and a
       rocket, inspired by the Pop!_OS installer artwork. GPL-3.0-only -->
  <defs>
    <radialGradient id="space" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#1d4f80"/>
      <stop offset="1" stop-color="#0a1d36"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b46b"/>
      <stop offset="1" stop-color="#c25f2a"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9aa6b4"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#8fdcff"/>
      <stop offset="1" stop-color="#4ab4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#6cc8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6cc8ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="port"><circle cx="32" cy="34" r="24"/></clipPath>
  </defs>

  <!-- porthole -->
  <circle cx="32" cy="34" r="28.5" fill="#0b1626"/>
  <circle cx="32" cy="34" r="24" fill="url(#space)"/>
  <g clip-path="url(#port)">
    <circle cx="20" cy="24" r="0.9" fill="#fff" opacity="0.8"/>
    <circle cx="40" cy="20" r="0.7" fill="#fff" opacity="0.7"/>
    <circle cx="27" cy="16" r="0.6" fill="#fff" opacity="0.6"/>
    <circle cx="14" cy="38" r="0.7" fill="#fff" opacity="0.6"/>
    <!-- planet -->
    <circle cx="50" cy="52" r="27" fill="url(#planet)" stroke="#8fd3e0" stroke-width="2.5"/>
    <ellipse cx="44" cy="40" rx="5" ry="2.6" fill="#f9c58c" opacity="0.7"/>
    <ellipse cx="52" cy="47" rx="3.5" ry="2" fill="#a94f22" opacity="0.45"/>
    <ellipse cx="38" cy="52" rx="4" ry="2" fill="#f9c58c" opacity="0.5"/>
    <!-- moon -->
    <circle cx="17.5" cy="25" r="3" fill="#cfd3dc" stroke="#eef5f7" stroke-width="1.2"/>
  </g>
  <circle cx="32" cy="34" r="25.3" fill="none" stroke="#f4efd8" stroke-width="3"/>

  <!-- sun sitting on the rim -->
  <circle cx="38" cy="9" r="5.5" fill="#f5c63c" stroke="#f4efd8" stroke-width="2.2"/>

  <!-- rocket, flying up and to the right -->
  <g transform="translate(23 44) rotate(-38)">
    <ellipse cx="-17" cy="0" rx="13" ry="3.2" fill="url(#trail)"/>
    <path d="M-6 -4 L-13 -11.5 L-2 -4 Z" fill="#dfe5ec" stroke="#7d8896" stroke-width="0.6"/>
    <path d="M-6 4 L-13 11.5 L-2 4 Z" fill="#c9d1db" stroke="#7d8896" stroke-width="0.6"/>
    <path d="M-10 -4.4 L5 -4.4 Q13 -2.6 15.5 0 Q13 2.6 5 4.4 L-10 4.4 Q-11.5 0 -10 -4.4 Z"
          fill="url(#hull)" stroke="#6f7b8a" stroke-width="0.7"/>
    <rect x="1" y="-4.3" width="2" height="8.6" fill="#33bccc"/>
    <rect x="5" y="-4.1" width="1.2" height="8.2" fill="#33bccc"/>
    <circle cx="-10.5" cy="0" r="6" fill="url(#glow)"/>
  </g>
</svg>
