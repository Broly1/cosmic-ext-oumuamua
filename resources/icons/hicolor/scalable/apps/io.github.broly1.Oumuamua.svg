<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- COSMIC Oumuamua icon: a porthole into space with a planet and a
       rocket, inspired by the Pop!_OS installer artwork. Everything stays
       inside the circle with a margin so it never looks cut off in a
       panel. GPL-3.0-only -->
  <defs>
    <radialGradient id="space" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#1d4f80"/>
      <stop offset="1" stop-color="#0a1d36"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b46b"/>
      <stop offset="1" stop-color="#c25f2a"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9aa6b4"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#8fdcff"/>
      <stop offset="1" stop-color="#4ab4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#6cc8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6cc8ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="port"><circle cx="32" cy="33" r="21"/></clipPath>
  </defs>

  <!-- porthole -->
  <circle cx="32" cy="33" r="25" fill="#0b1626"/>
  <circle cx="32" cy="33" r="21" fill="url(#space)"/>
  <g clip-path="url(#port)">
    <circle cx="22" cy="20" r="0.8" fill="#fff" opacity="0.8"/>
    <circle cx="38" cy="18" r="0.6" fill="#fff" opacity="0.7"/>
    <circle cx="16" cy="36" r="0.6" fill="#fff" opacity="0.6"/>
    <!-- planet -->
    <circle cx="48" cy="50" r="21" fill="url(#planet)" stroke="#8fd3e0" stroke-width="2.2"/>
    <ellipse cx="43" cy="40" rx="4" ry="2" fill="#f9c58c" opacity="0.7"/>
    <ellipse cx="50" cy="46" rx="3" ry="1.7" fill="#a94f22" opacity="0.45"/>
    <!-- moon -->
    <circle cx="19" cy="25" r="2.4" fill="#cfd3dc" stroke="#eef5f7" stroke-width="1"/>
    <!-- rocket, flying up and to the right, fully inside the porthole -->
    <g transform="translate(28 37) rotate(-40) scale(1.3)">
      <ellipse cx="-14" cy="0" rx="8" ry="2.6" fill="url(#trail)"/>
      <path d="M-5 -3.4 L-10.5 -9.5 L-1.5 -3.4 Z" fill="#dfe5ec" stroke="#7d8896" stroke-width="0.5"/>
      <path d="M-5 3.4 L-10.5 9.5 L-1.5 3.4 Z" fill="#c9d1db" stroke="#7d8896" stroke-width="0.5"/>
      <path d="M-8.5 -3.7 L4 -3.7 Q10.5 -2.2 12.5 0 Q10.5 2.2 4 3.7 L-8.5 3.7 Q-9.7 0 -8.5 -3.7 Z"
            fill="url(#hull)" stroke="#6f7b8a" stroke-width="0.6"/>
      <rect x="0.8" y="-3.6" width="1.7" height="7.2" fill="#33bccc"/>
      <rect x="4.2" y="-3.4" width="1" height="6.8" fill="#33bccc"/>
      <circle cx="-9" cy="0" r="4.6" fill="url(#glow)"/>
    </g>
  </g>
  <circle cx="32" cy="33" r="22.2" fill="none" stroke="#f4efd8" stroke-width="2.6"/>

  <!-- sun sitting on the rim -->
  <circle cx="43" cy="13.8" r="4.2" fill="#f5c63c" stroke="#f4efd8" stroke-width="1.8"/>
</svg>
