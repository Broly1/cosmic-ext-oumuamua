<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Symbolic variant: porthole ring, sun on the rim, planet and rocket.
       Single colour; the desktop tints it to match the panel. GPL-3.0-only -->
  <defs>
    <mask id="ring-cut">
      <rect width="16" height="16" fill="#fff"/>
      <circle cx="10.9" cy="3.6" r="2.3" fill="#000"/>
    </mask>
    <mask id="planet-cut">
      <rect width="16" height="16" fill="#fff"/>
      <g transform="translate(7.6 9.4) rotate(-40) scale(1.25)">
        <path d="M-4.3 -2.6 L2.2 -2.6 Q5.6 -1.2 6.4 0 Q5.6 1.2 2.2 2.6 L-4.3 2.6 Z" fill="#000"/>
        <path d="M-2.4 -1.6 L-5.6 -5 L0.6 -1.6 Z M-2.4 1.6 L-5.6 5 L0.6 1.6 Z" fill="#000"/>
      </g>
    </mask>
    <clipPath id="inside"><circle cx="8" cy="8.8" r="4.9"/></clipPath>
  </defs>
  <circle cx="8" cy="8.8" r="5.8" fill="none" stroke="#000" stroke-width="1.3" mask="url(#ring-cut)"/>
  <circle cx="10.9" cy="3.6" r="1.4" fill="#000"/>
  <g clip-path="url(#inside)" mask="url(#planet-cut)">
    <circle cx="13" cy="13.8" r="5.6" fill="#000" opacity="0.45"/>
  </g>
  <g clip-path="url(#inside)">
    <g transform="translate(7.6 9.4) rotate(-40) scale(1.25)">
      <path d="M-3.4 -1.6 L2 -1.6 Q4.6 -0.7 5.3 0 Q4.6 0.7 2 1.6 L-3.4 1.6 Z" fill="#000"/>
      <path d="M-2 -1.4 L-4.4 -3.9 L0.2 -1.4 Z M-2 1.4 L-4.4 3.9 L0.2 1.4 Z" fill="#000"/>
    </g>
  </g>
</svg>
