  <circle cx="12.6" cy="3.4" r="2.1" fill="#232323"/>
  <g transform="translate(8 8) rotate(-45)">
    <path fill="#232323" fill-rule="evenodd" d="M-2.6 -1.5 L1.2 -1.5 Q3.6 -0.8 4.3 0 Q3.6 0.8 1.2 1.5 L-2.6 1.5 Z M0.4 0 a0.8 0.8 0 1 0 1.6 0 a0.8 0.8 0 1 0 -1.6 0 Z"/>
    <path fill="#232323" d="M-1.2 -1.4 L-3.5 -2.6 L-3.5 -0.6 L-2.6 -0.6 L-2.6 0.6 L-3.5 0.6 L-3.5 2.6 L-1.2 1.4 Z"/>
